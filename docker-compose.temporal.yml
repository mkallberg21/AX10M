# Local Temporal cluster for running the AX10M recovery worker against a real server.
#
#   docker compose -f docker-compose.temporal.yml up -d
#   # UI at http://localhost:8080, frontend gRPC at localhost:7233
#   corepack pnpm --filter @ax10m/api build
#   corepack pnpm --filter @ax10m/api run worker      # SHADOW by default
#
# This is a DEV harness (Postgres-backed single node). It moves no money by itself —
# the worker defaults to shadow mode; real charging requires AX10M_LIVE_CHARGING=true
# AND real processor credentials in the worker's environment. See docs/RUNBOOK-WORKER.md.

services:
  temporal-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U temporal']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - temporal-pg:/var/lib/postgresql/data

  temporal:
    image: temporalio/auto-setup:1.25.2
    depends_on:
      temporal-postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: temporal-postgres
    ports:
      - '7233:7233' # frontend gRPC — TEMPORAL_ADDRESS=localhost:7233

  temporal-ui:
    image: temporalio/ui:2.34.0
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:8080
    ports:
      - '8080:8080'

volumes:
  temporal-pg:
