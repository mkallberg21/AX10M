<text x="64" y="42" font-size="11" fill="#475569">VERDICT: under these assumptions the AX10M engine beats the baseline by 13.29 pp (recovery-rate), with a positive holdout-verified lower bound — it would bill $40,039. — CAVEAT: this 13.81 pp win is over the DEFAULT-reach baseline (what merchants run); against a maximally-persistent baseline it is ~parity on recovery rate (1.94 pp) — the durable edge is the dead-credential capability + cost/compliance, not raw rate vs an all-out retrier.</text>
